{% extends "./base.html" %}
{% load i18n %}

{% block head-title %}
    {% block title %}{{ block.super }}{% endblock %} | {{ block.super }}
{% endblock %}

{% block app %}
{{ block.super }}
{% if not no_panels %}
    <template #app-nav="{context}">{% block app-nav %}{% endblock %}</template>
{% endif %}

{% for panel in panels.get_panels %}
<template #panels.{{ panel.name }}>
    {% include panel.template %}
</template>
{% endfor %}
{% endblock %}
