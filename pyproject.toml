[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "oxylus"
description = "Oxylus back-office framework."
version = "0.0.1"
authors = ["Thomas Baquet <thomas oxylus app>"]
readme = "README.rst"
license = "GPL-3.0-or-later"
packages = [
    { include = "ox" },
]
include = [
    # assets are provided as npm packages
    # {path="assets", format="sdist"},
    {path="docs", format="sdist"},
    {path="tests", format="sdist"},
]
exclude = [
]

classifiers = [
    "Framework :: Django",
    "Framework :: Oxylus",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
]


[tool.poetry.dependencies]
python = "^3.13"
Django = "^5"
djangorestframework = "^3"
django-filter = "*"
django-model-utils="*"
django-tasks = "^0.7.0"
django-fernet-encrypted-fields = "^0.3.0"
drf-spectacular = "^0.28.0"
bleach = {extras = ["css"], version = "^6.2.0"}
dynaconf = {extras = ["yaml"], version = "^3.2.11"}
python-magic = "^0.4.27"
pymupdf = "^1.26.0"
rich = "^14.1.0"
beautifulsoup4 = "^4.14.3"
pydantic = "^2.12.5"
pyjwt = "^2.10.1"
django-caps = "^0.0.2"
wsgidav = {extras = ["auth-digest"], version = "^4.3.3"}


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipython = "*"
pre-commit = "*"
black = "*"
ruff = "*"
pytest = "*"
pytest-django = "*"
pytest-asyncio = "^1.0.0"
pytest-mock = "^3.14.1"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "*"
# sphinx-js = "*"
sphinx-rtd-theme = "*"
sphinx-autodoc-typehints = "*"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ox.settings.test"
OX_ENV = "tests"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]


[tool.black]
line-length = 120
exclude = '''
    /(
          \.egg
        | \.git
        | \.hg
        | \.tox
        | \._build
        | \.build
        | \.bulk-out
        | \.dist
        | \.__pycache__
        | \.venv
        | \.migrations
        | \.static
        | \.ox/settings
        | \.scripts
    )
'''


[tool.ruff]
line-length = 120
exclude = [
    "egg",
    "git",
    "hg",
    "tox",
    "_build",
    "build",
    "dist",
    "__pycache__",
    "venv",
    "*/migrations",
    "*/static",
    "ox/settings",
    "scripts/",
]


[tool.semantic_release]
version_variables = ["ox/__init__.py:__version__"]
version_toml = [
    "pyproject.toml:tool.poetry.version",
]
