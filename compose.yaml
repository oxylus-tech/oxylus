version: "3.9"

# ---------------------------------------------------------------------
# Common variables and declarations
# ---------------------------------------------------------------------

# -- Common env variables
x-common-env: &common-env
  # Postgres variables, fullfill both as OX_* are passed down to Oxylus
  POSTGRES_USER: oxylus
  POSTGRES_PASSWORD: secret
  POSTGRES_DB: oxylus
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  OX_ENV: production

# -- Base container for oxylus services
x-oxylus-simple-container: &oxylus-simple-container
  build:
    context: .
    dockerfile: scripts/runtime.Dockerfile
  environment:
    <<: *common-env
  volumes:
    - oxylus-static:/srv/oxylus/static
    - oxylus-conf:/srv/oxylus/conf
  depends_on:
    - db

# -- Container to use for oxylus services (awaiting init)
x-oxylus-container: &oxylus-container
  <<: *oxylus-simple-container
  depends_on: &oxylus-container-depends
    db:
        condition: service_started
    oxylus-init:
        condition: service_completed_successfully


# ---------------------------------------------------------------------
# Actual docker compose settings
# ---------------------------------------------------------------------
volumes:
  db-data:
  oxylus-static:
  oxylus-conf:

services:
  db:
    image: postgres:15
    environment:
      <<: *common-env
    volumes:
      - db-data:/var/lib/postgresql/data

  oxylus-init:
    <<: *oxylus-simple-container
    command: init

  oxylus-tasks:
    <<: *oxylus-container
    command: ./manage.py db_worker

  oxylus:
    <<: *oxylus-container
    command: run
    ports:
      - "8042:8042"
    environment:
      <<: *common-env
      OX_DEBUG: true
    depends_on:
      <<: *oxylus-container-depends
      oxylus-tasks:
          condition: service_started

  nginx:
    image: nginx:1.25
    ports:
      - "8080:80"
    volumes:
      - ./scripts/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - oxylus-static:/srv/oxylus/static
    depends_on:
      - oxylus
